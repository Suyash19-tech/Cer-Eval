services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hal
      POSTGRES_PASSWORD: ${HAL_DB_PASSWORD:?set HAL_DB_PASSWORD}
      POSTGRES_DB: hal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hal"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      HAL_DATABASE_URL: postgresql+psycopg://hal:${HAL_DB_PASSWORD}@postgres:5432/hal
      HAL_DATA_DIR: /data
      HAL_REVIEWER_TOKENS: ${HAL_REVIEWER_TOKENS:-}
      HAL_OFFLINE: "true"
    volumes:
      - ./data:/data
      - ./models:/models:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        HAL_BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
